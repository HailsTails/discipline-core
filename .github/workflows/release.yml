name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release the package tarball
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - name: Require the tag to match the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
      - name: Check the package builds deterministically
        run: bun run package-determinism
      - name: Prove the package installs and runs in real consumers
        run: bun run install-proof
      - name: Pack the package
        run: bun run pack-package
      - name: Attach the tarball to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          title="$(node scripts/release-text-command.ts title "$GITHUB_REF_NAME")"
          notes="$(node scripts/release-text-command.ts notes "$GITHUB_REF_NAME")"
          gh release create "$GITHUB_REF_NAME" artefacts/*.tgz --verify-tag --title "$title" --notes "$notes" "${prerelease[@]}"

  publish-npm:
    name: Publish the released tarball to npm
    needs: release
    if: vars.NPM_PUBLISH == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          registry-url: 'https://registry.npmjs.org'
      - name: Install the npm that supports trusted publishing
        run: npm install --global npm@11.6.2
      - name: Download the tarball attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --dir artefacts
      - name: Publish the tarball under its dist-tag
        run: |
          tarballs=(artefacts/*.tgz)
          test "${#tarballs[@]}" -eq 1
          test -f "${tarballs[0]}"
          dist_tag=latest
          case "$GITHUB_REF_NAME" in *-*) dist_tag=next ;; esac
          npm publish "./${tarballs[0]}" --tag "$dist_tag"