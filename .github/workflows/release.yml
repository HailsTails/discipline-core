name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release the package tarball
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      tarball-name: ${{ steps.tarball.outputs.name }}
      tarball-sha256: ${{ steps.tarball.outputs.sha256 }}
      dist-tag: ${{ steps.dist-tag.outputs.value }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - name: Require the tag to match the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
      - name: Check the package builds deterministically
        run: bun run package-determinism
      - name: Prove the package installs and runs in real consumers
        run: bun run install-proof
      - name: Pack the package
        run: bun run pack-package
      - name: Fingerprint the packed tarball
        id: tarball
        run: |
          tarballs=(artefacts/*.tgz)
          test "${#tarballs[@]}" -eq 1
          sha256="$(sha256sum "${tarballs[0]}" | cut -d ' ' -f 1)"
          echo "name=$(basename "${tarballs[0]}")" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - name: Choose the dist-tag
        id: dist-tag
        run: |
          dist_tag="$(node scripts/release-text-command.ts dist-tag "$GITHUB_REF_NAME")"
          echo "value=$dist_tag" >> "$GITHUB_OUTPUT"
      - name: Attach the tarball to a release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL_NAME: ${{ steps.tarball.outputs.name }}
          DIST_TAG: ${{ steps.dist-tag.outputs.value }}
        run: |
          prerelease=()
          case "$DIST_TAG" in next) prerelease=(--prerelease) ;; esac
          title="$(node scripts/release-text-command.ts title "$GITHUB_REF_NAME")"
          notes="$(node scripts/release-text-command.ts notes "$GITHUB_REF_NAME")"
          gh release create "$GITHUB_REF_NAME" "artefacts/$TARBALL_NAME" --verify-tag --title "$title" --notes "$notes" "${prerelease[@]}"

  publish-npm:
    name: Publish the released tarball to npm
    needs: release
    if: vars.NPM_PUBLISH == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      TARBALL_NAME: ${{ needs.release.outputs.tarball-name }}
      TARBALL_SHA256: ${{ needs.release.outputs.tarball-sha256 }}
      DIST_TAG: ${{ needs.release.outputs.dist-tag }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          registry-url: 'https://registry.npmjs.org'
      - name: Install the npm that supports trusted publishing
        run: npm install --global npm@11.6.2
      - name: Download the tarball attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TARBALL_NAME" in */* | '') exit 1 ;; *.tgz) ;; *) exit 1 ;; esac
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$TARBALL_NAME" --dir artefacts
      - name: Refuse any tarball but the one the release job packed
        run: |
          test -n "$TARBALL_SHA256"
          printf '%s  %s\n' "$TARBALL_SHA256" "artefacts/$TARBALL_NAME" | sha256sum --check --strict
      - name: Publish the tarball under its dist-tag
        run: |
          case "$DIST_TAG" in next | latest) ;; *) exit 1 ;; esac
          npm publish "./artefacts/$TARBALL_NAME" --tag "$DIST_TAG"
