name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Discipline core on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
      - name: Run Hone's disciplines on Hone
        shell: bash
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_REVISION"
          case "$base" in *[!0]*) ;; *) base=origin/main ;; esac
          bun run self-check -- --base-revision "$base"
      - name: Build the package
        run: bun run build-package
      - name: Check the package builds deterministically
        run: bun run package-determinism
      - name: Prove a package install
        run: bun run install-proof

  linux:
    name: Discipline core on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
      - name: Run Hone's disciplines on Hone
        shell: bash
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_REVISION"
          case "$base" in *[!0]*) ;; *) base=origin/main ;; esac
          bun run self-check -- --base-revision "$base"
      - name: Build the package
        run: bun run build-package
      - name: Check the package builds deterministically
        run: bun run package-determinism
      - name: Prove a package install
        run: bun run install-proof

  supported-node:
    name: Package on Node ${{ matrix.node-version }} on ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux, runner: ubuntu-latest, node-version: 22.13.0, run-tests: false }
          - { platform: Windows, runner: windows-latest, node-version: 22.13.0, run-tests: false }
          - { platform: macOS, runner: macos-latest, node-version: 22.13.0, run-tests: false }
          - { platform: Linux, runner: ubuntu-latest, node-version: 24, run-tests: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the package
        run: node --experimental-strip-types scripts/build-package.ts
      - name: Prove a package install
        run: node --experimental-strip-types scripts/install-proof.ts
      - name: Run the tests
        if: ${{ matrix.run-tests }}
        run: bun run test
