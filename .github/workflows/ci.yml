name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Discipline core on Windows
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm run check
      - name: Run Hone's disciplines on Hone
        shell: bash
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_REVISION"
          case "$base" in *[!0]*) ;; *) base=origin/main ;; esac
          pnpm run self-check --base-revision "$base"
      - name: Build the package
        run: pnpm run build-package
      - name: Check the package builds deterministically
        run: pnpm run package-determinism
      - name: Prove a package install
        run: pnpm run install-proof

  linux:
    name: Discipline core on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm run check
      - name: Run Hone's disciplines on Hone
        shell: bash
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_REVISION"
          case "$base" in *[!0]*) ;; *) base=origin/main ;; esac
          pnpm run self-check --base-revision "$base"
      - name: Build the package
        run: pnpm run build-package
      - name: Check the package builds deterministically
        run: pnpm run package-determinism
      - name: Prove a package install
        run: pnpm run install-proof

  supported-node:
    name: Package on Node ${{ matrix.node-version }} on ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macOS, runner: macos-26, node-version: 22.18.0, run-tests: false }
          - { platform: Linux, runner: ubuntu-24.04, node-version: 24, run-tests: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the package
        run: pnpm run build-package
      - name: Prove a package install
        run: pnpm run install-proof
      - name: Run the tests
        if: ${{ matrix.run-tests }}
        run: pnpm run test
